<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Destination Surprise</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        /* Interface Overlay Styles */
        .overlay-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            z-index: 1000;
            pointer-events: none; /* Let clicks pass through to map */
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .overlay-bottom {
            position: absolute;
            bottom: 2rem;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            gap: 10px;
        }

        .start-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.5);
            pointer-events: auto;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            max-width: 90%;
        }
        .start-btn:active { transform: scale(0.95); }
        .start-btn.loading {
            background: #4b5563;
            box-shadow: none;
            cursor: wait;
        }

        /* Custom Marker Pulse */
        .user-pulse {
            background: #3b82f6;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(59, 130, 246, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* Recenter Button Active State */
        .recenter-active {
            color: #3b82f6 !important;
            background-color: #eff6ff !important;
            border: 2px solid #3b82f6;
        }

        /* Hide Leaflet controls slightly */
        .leaflet-control-attribution { font-size: 8px; opacity: 0.5; }
    </style>
</head>
<body>

    <!-- HUD Navigation -->
    <div class="overlay-top" id="nav-panel" style="display: none;">
        <div class="card p-4 max-w-md mx-auto">
            <div class="flex items-center gap-4">
                <div id="maneuver-icon" class="bg-blue-100 w-12 h-12 rounded-full flex items-center justify-center text-blue-600 text-xl transition-transform duration-500">
                    <i class="fas fa-location-arrow"></i>
                </div>
                <div class="flex-1">
                    <h2 id="instruction-text" class="text-lg font-bold text-gray-800 leading-tight">Calcul de l'itinéraire...</h2>
                    <p id="distance-text" class="text-sm text-gray-500 font-mono mt-1">-- m</p>
                </div>
            </div>
        </div>
        <div class="mt-2 text-center">
            <span class="bg-black/50 text-white text-xs px-2 py-1 rounded-full backdrop-blur-md">
                Destination inconnue
            </span>
        </div>
        <div id="error-banner" class="hidden mt-2 text-center bg-red-500/80 text-white text-xs py-1 px-2 rounded">
            Mode Boussole (Réseau faible)
        </div>
    </div>

    <!-- Start Button / Bottom Controls -->
    <div class="overlay-bottom">
        <button id="start-btn" class="start-btn animate-bounce">
            <i class="fas fa-play mr-2"></i> Commencer l'Aventure
        </button>
        
        <!-- Manual Sim Button (shown if GPS fails) -->
        <button id="manual-sim-btn" onclick="forceSimulation()" class="hidden pointer-events-auto bg-gray-800 text-white px-4 py-2 rounded-full text-sm border border-gray-600 shadow-lg transition-colors duration-300">
            <i class="fas fa-robot mr-1"></i> Activer Mode Simulation
        </button>
        
        <div id="stats-panel" class="hidden card px-6 py-3 flex items-center gap-4">
            <div class="text-center">
                <div class="text-xs text-gray-400 uppercase">Restant</div>
                <div id="total-dist" class="font-bold text-gray-800">-- km</div>
            </div>
            <div class="h-8 w-px bg-gray-200"></div>
            <!-- Recenter Button -->
            <button id="recenter-btn" onclick="toggleAutoCenter()" class="w-10 h-10 bg-gray-100 rounded-full text-gray-600 hover:bg-gray-200 active:bg-gray-300 pointer-events-auto transition-colors recenter-active">
                <i class="fas fa-crosshairs"></i>
            </button>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // --- CONFIGURATION ---
        const DESTINATION = { lat: 46.575917, lng: 5.954412 }; // Position surprise
        const FOG_RADIUS = 1500; // Mètres (Visibilité)
        
        // --- STATE ---
        let map, userMarker, fogLayer, routePolyline;
        let userPos = null;
        let navigationStarted = false;
        let isSimulating = false;
        let simulationInterval;
        let useCompassMode = false; 
        let autoCenter = true; // Centrage automatique activé par défaut

        // --- INITIALIZATION ---
        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([46.5, 5.9], 6);

            // Styles de carte (Dark pour le contraste avec le brouillard)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd'
            }).addTo(map);

            // Initial Fog
            drawFog({ lat: 0, lng: 0 }, 0); 
            
            // Détecter si l'utilisateur bouge la carte manuellement pour désactiver l'auto-centrage
            map.on('dragstart', () => {
                if (navigationStarted && autoCenter) {
                    autoCenter = false;
                    updateRecenterBtn();
                }
            });

            if (!window.isSecureContext && location.hostname !== 'localhost' && location.protocol !== 'file:') {
                alert("Attention : La géolocalisation nécessite une connexion sécurisée (HTTPS).");
            }
        }

        // --- FOG OF WAR LOGIC ---
        function drawFog(center, radiusMeters) {
            // Astuce : On dessine le brouillard APRÈS la route pour que la route disparaisse sous le noir
            // mais soit visible dans le trou (le cercle clair).
            
            if (fogLayer) map.removeLayer(fogLayer);

            const world = [
                [90, -180],
                [90, 180],
                [-90, 180],
                [-90, -180]
            ];

            const hole = [];
            const points = 64;
            const radiusDegLat = radiusMeters / 111320; 
            
            for (let i = 0; i < points; i++) {
                const theta = (i / points) * (2 * Math.PI);
                const x = center.lng + (radiusDegLat * Math.cos(theta)) / Math.cos(center.lat * Math.PI / 180);
                const y = center.lat + (radiusDegLat * Math.sin(theta));
                hole.push([y, x]);
            }

            fogLayer = L.polygon([world, hole], {
                color: 'transparent',
                fillColor: '#0f172a', 
                fillOpacity: 0.95,
                interactive: false,
                zIndex: 1000 // S'assurer que le brouillard est au-dessus
            }).addTo(map);
        }

        // --- NAVIGATION LOGIC ---
        document.getElementById('start-btn').addEventListener('click', () => {
            const btn = document.getElementById('start-btn');
            btn.classList.remove('animate-bounce');
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-satellite-dish fa-spin mr-2"></i> Activation GPS...<br><span class="text-xs font-normal opacity-80">Veuillez autoriser la localisation</span>';
            startGeolocation();
        });

        function startGeolocation() {
            if (isSimulating) {
                onGpsSuccess({ coords: { latitude: 46.55, longitude: 5.90 } });
                startSimulation();
                return;
            }

            if ("geolocation" in navigator) {
                const options = { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 };
                navigator.geolocation.watchPosition(onGpsSuccess, handleGeoError, options);
            } else {
                handleGeoError({ code: 0, message: "Géolocalisation non supportée" });
            }
        }

        function onGpsSuccess(position) {
            if (!navigationStarted) {
                navigationStarted = true;
                document.getElementById('start-btn').classList.add('hidden');
                document.getElementById('nav-panel').style.display = 'block';
                document.getElementById('stats-panel').classList.remove('hidden');
                document.getElementById('stats-panel').classList.add('flex');
            }
            updatePosition(position);
        }

        function handleGeoError(err) {
            console.error("Erreur GPS:", err);
            let msg = "Signal GPS introuvable";
            let subMsg = "Essayez le mode simulation";

            const btn = document.getElementById('start-btn');
            btn.classList.remove('hidden', 'loading', 'animate-bounce');
            btn.style.background = '#dc2626'; 
            
            if (err.code === 1) {
                msg = "Accès GPS refusé";
                btn.innerHTML = '<i class="fas fa-lock mr-2"></i> Accès refusé';
            } else {
                btn.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i> Erreur GPS';
            }

            if (navigationStarted) {
                document.getElementById('instruction-text').innerText = msg;
                document.getElementById('instruction-text').classList.add('text-red-600');
            }
            
            const simBtn = document.getElementById('manual-sim-btn');
            simBtn.classList.remove('hidden');
            simBtn.classList.add('bg-red-600', 'animate-pulse'); 
        }

        function forceSimulation() {
            document.getElementById('manual-sim-btn').classList.add('hidden');
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('nav-panel').style.display = 'block';
            document.getElementById('stats-panel').classList.remove('hidden');
            document.getElementById('stats-panel').classList.add('flex');
            document.getElementById('instruction-text').classList.remove('text-red-600');
            
            navigationStarted = true;
            isSimulating = true;
            startSimulation();
        }

        function updatePosition(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            userPos = { lat, lng };

            // 1. Update Marker
            if (!userMarker) {
                const icon = L.divIcon({
                    className: 'user-pulse',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                userMarker = L.marker([lat, lng], { icon: icon, zIndexOffset: 1000 }).addTo(map);
                map.setView([lat, lng], 16);
            } else {
                userMarker.setLatLng([lat, lng]);
            }

            // 2. Auto-Centering Logic
            if (autoCenter) {
                map.panTo([lat, lng], { animate: true, duration: 0.5 });
            }

            // 3. Update Fog (Toujours centré sur le joueur)
            drawFog(userPos, FOG_RADIUS);

            // 4. Check Arrival
            const distToDest = getDistanceFromLatLonInKm(lat, lng, DESTINATION.lat, DESTINATION.lng);
            if (distToDest < 0.05) { 
                handleArrival();
                return;
            }

            // 5. Route
            if (navigationStarted) {
                if (useCompassMode) {
                    updateCompassUI(userPos, distToDest);
                } else {
                    getRoute(userPos).catch(err => {
                        useCompassMode = true;
                        document.getElementById('error-banner').classList.remove('hidden');
                        updateCompassUI(userPos, distToDest);
                    });
                }
            }
        }

        async function getRoute(current) {
            const url = `https://router.project-osrm.org/route/v1/driving/${current.lng},${current.lat};${DESTINATION.lng},${DESTINATION.lat}?steps=true&geometries=geojson&overview=full&language=fr`;

            const response = await fetch(url, { method: 'GET' });
            if (!response.ok) throw new Error("Network response was not ok");
            
            const data = await response.json();

            if (data.code === 'Ok') {
                const route = data.routes[0];
                const steps = route.legs[0].steps;
                
                const coordinates = route.geometry.coordinates.map(c => [c[1], c[0]]);
                
                // Mettre à jour la ligne bleue
                if (routePolyline) map.removeLayer(routePolyline);
                
                routePolyline = L.polyline(coordinates, {
                    color: '#6366f1', // Couleur Indigo vif
                    weight: 8,        // Ligne épaisse
                    opacity: 0.8,
                    lineCap: 'round',
                    lineJoin: 'round'
                }).addTo(map);
                
                // IMPORTANT: Envoyer la route derrière le marqueur mais elle sera coupée par le brouillard
                routePolyline.bringToBack(); 

                updateUI(route, steps);
            }
        }

        function updateUI(route, steps) {
            const distKm = (route.distance / 1000).toFixed(1);
            document.getElementById('total-dist').innerText = `${distKm} km`;
            
            document.getElementById('maneuver-icon').style.transform = 'rotate(0deg)';

            if (steps.length > 0) {
                // Logique améliorée pour afficher la prochaine vraie instruction
                let nextStep = steps[0];
                if (nextStep.distance < 30 && steps.length > 1) {
                    nextStep = steps[1];
                }
                formatInstruction(nextStep);
            }
        }

        function formatInstruction(step) {
            const modifier = step.maneuver.modifier;
            const type = step.maneuver.type;
            const name = step.name || "";
            const dist = Math.round(step.distance);

            let text = `Continuez sur ${dist}m`;
            let icon = "fa-arrow-up";

            if (type === 'turn' || type === 'roundabout' || type === 'merge') {
                if (modifier && modifier.includes('left')) {
                    text = `Tournez à Gauche`;
                    icon = "fa-arrow-left";
                } else if (modifier && modifier.includes('right')) {
                    text = `Tournez à Droite`;
                    icon = "fa-arrow-right";
                } else if (modifier && modifier.includes('straight')) {
                    text = `Allez tout droit`;
                    icon = "fa-arrow-up";
                }
                if (name) text += ` vers ${name}`;
            } else if (type === 'arrive') {
                text = "C'est tout près !";
                icon = "fa-star";
            }

            document.getElementById('instruction-text').innerText = text;
            document.getElementById('distance-text').innerText = `Dans ${dist} mètres`;
            document.getElementById('maneuver-icon').innerHTML = `<i class="fas ${icon}"></i>`;
        }

        // --- UI HELPERS ---
        function toggleAutoCenter() {
            autoCenter = !autoCenter;
            if(autoCenter && userPos) {
                map.panTo([userPos.lat, userPos.lng], { animate: true });
            }
            updateRecenterBtn();
        }

        function updateRecenterBtn() {
            const btn = document.getElementById('recenter-btn');
            if (autoCenter) {
                btn.classList.add('recenter-active');
            } else {
                btn.classList.remove('recenter-active');
            }
        }

        function recenterMap() {
            // Legacy wrapper
            toggleAutoCenter();
        }

        // --- FALLBACK COMPASS ---
        function updateCompassUI(current, distKm) {
            document.getElementById('total-dist').innerText = `${distKm.toFixed(1)} km`;
            const bearing = getBearing(current.lat, current.lng, DESTINATION.lat, DESTINATION.lng);
            
            document.getElementById('instruction-text').innerText = "Suivez la flèche";
            document.getElementById('distance-text').innerText = "Direction Vol d'Oiseau";
            
            const iconContainer = document.getElementById('maneuver-icon');
            iconContainer.innerHTML = `<i class="fas fa-location-arrow"></i>`;
            iconContainer.style.transform = `rotate(${bearing - 45}deg)`;
        }

        function getBearing(startLat, startLng, destLat, destLng) {
            const startLatRad = deg2rad(startLat);
            const startLngRad = deg2rad(startLng);
            const destLatRad = deg2rad(destLat);
            const destLngRad = deg2rad(destLng);
            const y = Math.sin(destLngRad - startLngRad) * Math.cos(destLatRad);
            const x = Math.cos(startLatRad) * Math.sin(destLatRad) - Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(destLngRad - startLngRad);
            return (rad2deg(Math.atan2(y, x)) + 360) % 360;
        }

        function handleArrival() {
            document.getElementById('instruction-text').innerText = "VOUS ÊTES ARRIVÉS !";
            document.getElementById('instruction-text').classList.add('text-green-600');
            document.getElementById('maneuver-icon').innerHTML = '<i class="fas fa-gift fa-beat"></i>';
            document.getElementById('maneuver-icon').classList.add('bg-green-100', 'text-green-600');
            if (fogLayer) map.removeLayer(fogLayer);
            map.setView([DESTINATION.lat, DESTINATION.lng], 18);
            alert("SURPRISE !!! Regardez autour de vous !");
        }

        function getDistanceFromLatLonInKm(lat1,lon1,lat2,lon2) {
            var R = 6371; var dLat = deg2rad(lat2-lat1); var dLon = deg2rad(lon2-lon1); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }
        function deg2rad(deg) { return deg * (Math.PI/180); }
        function rad2deg(rad) { return rad * (180/Math.PI); }

        // --- SIMULATION ---
        function startSimulation() {
            let simLat = 46.55; let simLng = 5.90;
            if (simulationInterval) clearInterval(simulationInterval);
            simulationInterval = setInterval(() => {
                const dLat = (DESTINATION.lat - simLat) * 0.02;
                const dLng = (DESTINATION.lng - simLng) * 0.02;
                simLat += dLat; simLng += dLng;
                updatePosition({ coords: { latitude: simLat, longitude: simLng } });
                if (Math.abs(DESTINATION.lat - simLat) < 0.0001) clearInterval(simulationInterval);
            }, 1000);
        }

        window.onload = initMap;

    </script>
</body>
</html>
