<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Projet Noël Mystère</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* CSS inchangé pour cette version */
        body { margin: 0; padding: 0; background-color: #e0e0e0; font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        
        #top-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; background: white; border: 2px solid #007bff; /* Bordure bleue assortie à la flèche */
            border-radius: 15px; padding: 15px; z-index: 2000; text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: none;
        }
        #direction-text { font-size: 20px; font-weight: bold; color: #007bff; }
        #step-dist { font-size: 16px; color: #666; }

        #bottom-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; background: rgba(255, 255, 255, 0.95); padding: 20px;
            border-radius: 25px; z-index: 2000; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        #fuzzy-distance { font-size: 22px; font-weight: bold; color: #333; margin: 10px 0; }

        #start-btn {
            background: linear-gradient(45deg, #007bff, #0056b3); /* Bouton bleu aussi */
            color: white; border: none;
            padding: 15px 0; font-size: 18px; font-weight: 900; border-radius: 50px;
            cursor: pointer; width: 100%; margin-top: 10px;
        }

        #debug-log {
            font-size: 12px; color: red; margin-top: 10px; font-weight: bold;
            background: rgba(255,0,0,0.1); padding: 5px; border-radius: 5px; display: none;
        }
        #status { font-size: 12px; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="top-panel">
    <span style="font-size:30px">⬆️</span>
    <div id="direction-text">...</div>
    <div id="step-dist">...</div>
</div>

<div id="bottom-panel">
    <div style="font-size:12px; text-transform:uppercase; color:#888;">Destination Mystère</div>
    <div id="fuzzy-distance">??? km</div>

    <div id="start-container">
        <button id="start-btn" onclick="startNavigation()">Démarrer le GPS</button>
    </div>
    
    <div id="status">En attente d'action...</div>
    <div id="debug-log"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- CONFIGURATION ---
    const destination = { lat: 46.575928, lng: 5.954397 }; 
    const visibleRouteRadius = 1500;
    const OSRM_BASE_URL = 'https://router.project-osrm.org/route/v1/driving/';
    
    var map = L.map('map', { zoomControl: false }).setView([46.5, 5.9], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    // --- CHANGEMENT ICI : NOUVELLE ICONE FLECHE BLEUE ---
    var arrowIcon = L.icon({
        // URL d'une flèche de navigation bleue moderne
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/6395/6395336.png', 
        iconSize: [40, 40], // Taille ajustée
        iconAnchor: [20, 20] // Ancrée au centre
        // Note : Cette flèche ne tournera pas avec la boussole du téléphone
        // car c'est complexe à faire dans un simple navigateur web, mais elle indique la position.
    });

    var userMarker, routeLine;
    var fullRouteCoordinates = [];
    var routeSteps = [];
    var currentStepIndex = 0;
    var lastPosition = null; 

    // --- FONCTIONS DEBUG & UTILITAIRES ---
    function logDebug(msg, isError = false) {
        const el = document.getElementById('debug-log');
        const status = document.getElementById('status');
        status.innerText = msg;
        
        if (isError) {
            el.style.display = 'block'; el.innerText = "⚠️ " + msg; el.style.color = "red";
        } else {
            el.style.display = 'none';
        }
        console.log(msg);
    }

    function getFuzzyDistanceText(meters) {
        const km = meters / 1000;
        if (km > 1000) return "> 1000 km";
        if (km > 750) return "750 - 1000 km";
        if (km > 500) return "500 - 750 km";
        if (km > 250) return "250 - 500 km";
        if (km > 100) return "100 - 250 km";
        if (km > 50)  return "50 - 100 km";
        if (km > 20)  return "20 - 50 km";
        if (km > 10)  return "< 20 km";
        return "Arrivée proche !";
    }

    // --- DESSIN ROUTE ---
    function updateVisibleRouteLine(userLat, userLng) {
        if (!fullRouteCoordinates.length) return;
        const userLoc = L.latLng(userLat, userLng);
        const visiblePoints = [];

        for (let i = 0; i < fullRouteCoordinates.length; i++) {
            const p = fullRouteCoordinates[i];
            const ptLatLng = L.latLng(p[0], p[1]);
            if (userLoc.distanceTo(ptLatLng) <= visibleRouteRadius) {
                visiblePoints.push(p);
            }
        }
        if (routeLine) map.removeLayer(routeLine);
        // Ligne bleue maintenant pour aller avec la flèche
        routeLine = L.polyline(visiblePoints, { 
            color: '#007bff', weight: 7, opacity: 0.8, lineCap: 'round' 
        }).addTo(map);
    }

    // --- CALCUL OSRM ---
    function calculateRoute(lat, lng) {
        logDebug("Calcul itinéraire en cours...");
        const url = `${OSRM_BASE_URL}${lng},${lat};${destination.lng},${destination.lat}?geometries=geojson&steps=true&language=fr&overview=full`;

        fetch(url)
            .then(r => { if (!r.ok) throw new Error("Serveur occupé"); return r.json(); })
            .then(data => {
                if (!data.routes || data.routes.length === 0) { logDebug("Route introuvable", true); return; }
                const route = data.routes[0];
                document.getElementById('fuzzy-distance').innerText = getFuzzyDistanceText(route.distance);
                fullRouteCoordinates = route.geometry.coordinates.map(c => [c[1], c[0]]);
                routeSteps = route.legs[0].steps;
                updateVisibleRouteLine(lat, lng);
                updatePanel(lat, lng);
                logDebug("Route OK. Suivez la ligne bleue !");
            })
            .catch(e => { logDebug("Erreur Route (Réessayer): " + e.message, true); });
    }

    function updatePanel(lat, lng) {
        if (!routeSteps.length) return;
        let step = routeSteps[currentStepIndex];
        let dist = L.latLng(lat, lng).distanceTo(L.latLng(step.maneuver.location[1], step.maneuver.location[0]));
        
        if (dist < 40 && currentStepIndex < routeSteps.length - 1) {
            currentStepIndex++; step = routeSteps[currentStepIndex];
        }
        document.getElementById('top-panel').style.display = 'block';
        document.getElementById('direction-text').innerText = step.maneuver.instruction || "Continuez";
        document.getElementById('step-dist').innerText = Math.round(dist) + " m";
    }

    // --- GPS ---
    function startNavigation() {
        document.getElementById('start-container').style.display = 'none';
        logDebug("Recherche GPS (Sortez dehors !)...");
        map.locate({ setView: true, maxZoom: 17, watch: true, enableHighAccuracy: true });
    }

    function onLocationFound(e) {
        const lat = e.latitude;
        const lng = e.longitude;
        
        if (!userMarker) {
            // UTILISATION DE LA NOUVELLE ICONE ICI (arrowIcon)
            userMarker = L.marker([lat, lng], {icon: arrowIcon, zIndexOffset: 1000}).addTo(map);
            calculateRoute(lat, lng);
        } else {
            userMarker.setLatLng([lat, lng]);
        }
        
        map.panTo([lat, lng], {animate: true});
        updateVisibleRouteLine(lat, lng);
        updatePanel(lat, lng);
        
        if (!lastPosition || L.latLng(lat, lng).distanceTo(lastPosition) > 100) {
            calculateRoute(lat, lng);
            lastPosition = L.latLng(lat, lng);
        }
    }

    function onLocationError(e) {
        logDebug("Erreur GPS. Vérifiez les permissions.", true);
        document.getElementById('start-container').style.display = 'block';
    }

    map.on('locationfound', onLocationFound);
    map.on('locationerror', onLocationError);

</script>
</body>
</html>
