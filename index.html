<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Projet Noël Mystère</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        
        /* --- INTERFACE --- */
        #top-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; background: rgba(255, 255, 255, 0.95);
            border: 2px solid #007bff; border-radius: 15px; padding: 15px;
            z-index: 2000; text-align: center; color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: none;
        }
        #direction-icon { font-size: 40px; display: block; margin-bottom: 5px; }
        #direction-text { font-size: 20px; font-weight: bold; color: #007bff; line-height: 1.2; }
        #step-dist { font-size: 16px; color: #666; margin-top: 5px; }

        #bottom-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; background: rgba(255, 255, 255, 0.95); padding: 20px;
            border-radius: 25px; z-index: 2000; text-align: center; color: #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        h1 { margin: 0 0 10px 0; font-size: 16px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        #fuzzy-distance { font-size: 22px; font-weight: bold; color: #333; margin: 10px 0; }

        #start-btn {
            background: linear-gradient(45deg, #007bff, #0056b3); color: white;
            border: none; padding: 15px 0; font-size: 18px; font-weight: 900;
            border-radius: 50px; cursor: pointer; width: 100%; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4); margin-top: 10px;
        }
        #status { font-size: 10px; color: #888; margin-top: 15px; font-style: italic; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="top-panel">
    <span id="direction-icon">⬆️</span>
    <div id="direction-text">Prêt au départ</div>
    <div id="step-dist">0 m</div>
</div>

<div id="bottom-panel">
    <h1>Destination Mystère</h1>
    <div id="fuzzy-distance">??? km</div>

    <div id="start-container">
        <p style="font-size:14px; color:#666; margin-bottom:10px;">Activez le GPS pour commencer</p>
        <button id="start-btn" onclick="askForPermission()">Démarrer l'aventure</button>
    </div>
    <div id="status">En attente...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- CONFIGURATION ---
    const destination = { lat: 46.575928, lng: 5.954397 }; 
    const brouillardRadius = 1000; 
    const OSRM_BASE_URL = 'https://router.project-osrm.org/route/v1/driving/';
    
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([46.5, 5.9], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    var arrowIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/6395/6395336.png', 
        iconSize: [40, 40], iconAnchor: [20, 20]
    });
    
    L.marker([destination.lat, destination.lng], {
        icon: L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/1139/1139982.png', iconSize: [40, 40], iconAnchor: [20, 40] })
    }).addTo(map);

    var userMarker, fogLayer, routeLine;
    var routeSteps = [];
    var currentStepIndex = 0;
    var lastPosition = null;
    var isFallbackMode = false; // Pour savoir si on est en mode "Ligne droite"

    function getFuzzyDistanceText(meters) {
        const km = meters / 1000;
        if (km > 1000) return "Plus de 1000 km"; 
        if (km > 750) return "Entre 750 et 1000 km";
        if (km > 500) return "Entre 500 et 750 km";
        if (km > 250) return "Entre 250 et 500 km";
        if (km > 100) return "Entre 100 et 250 km";
        if (km > 50)  return "Entre 50 et 100 km";
        if (km > 20)  return "Entre 20 et 50 km";
        if (km > 10)  return "Moins de 20 km";
        if (km > 5)   return "Moins de 10 km";
        return "Approche Finale ! 🎁";
    }

    function logStatus(msg) { document.getElementById('status').innerText = msg; }

    function updateFog(lat, lng) {
        if (fogLayer) map.removeLayer(fogLayer);
        const earth = [[90, -180], [90, 180], [-90, 180], [-90, -180]];
        const hole = [];
        const rLat = brouillardRadius / 111320;
        const rLng = brouillardRadius / (111320 * Math.cos(lat * Math.PI / 180));
        for (let i = 0; i <= 360; i += 5) {
            const rad = i * (Math.PI / 180);
            hole.push([lat + rLat * Math.cos(rad), lng + rLng * Math.sin(rad)]);
        }
        fogLayer = L.polygon([earth, hole], { 
            color: 'white', fillColor: '#ffffff', fillOpacity: 0.85, stroke: false, interactive: false 
        }).addTo(map);
    }

    function getEmoji(modifier) {
        if (!modifier) return '⬆️';
        if (modifier.includes('left')) return '↖️';
        if (modifier.includes('right')) return '↗️';
        return '⬆️';
    }

    // --- PLAN B : MODE BOUSSOLE ---
    function enableFallbackMode(lat, lng) {
        isFallbackMode = true;
        logStatus("Mode Boussole (Serveur Route saturé)");
        
        // Calcul distance vol d'oiseau
        const dist = L.latLng(lat, lng).distanceTo([destination.lat, destination.lng]);
        document.getElementById('fuzzy-distance').innerText = getFuzzyDistanceText(dist);

        // Trace une ligne droite pointillée
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline([[lat, lng], [destination.lat, destination.lng]], {
            color: '#ff3333', weight: 4, opacity: 0.6, dashArray: '10, 10'
        }).addTo(map);

        // Met à jour le panneau
        document.getElementById('top-panel').style.display = 'block';
        document.getElementById('direction-icon').innerText = '🧭';
        document.getElementById('direction-text').innerText = "Suivez le cap";
        document.getElementById('step-dist').innerText = "Distance directe";

        if (fogLayer) fogLayer.bringToFront();
    }

    // --- ROUTAGE STANDARD ---
    function calculateRoute(lat, lng) {
        logStatus("Calcul itinéraire...");
        const url = `${OSRM_BASE_URL}${lng},${lat};${destination.lng},${destination.lat}?geometries=geojson&steps=true&language=fr&overview=full`;

        fetch(url)
            .then(r => {
                if (!r.ok) throw new Error("Erreur serveur");
                return r.json();
            })
            .then(data => {
                if (!data.routes || data.routes.length === 0) throw new Error("Pas de route");

                isFallbackMode = false;
                const
