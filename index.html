<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Projet Noël Mystère</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; }
        
        /* --- INTERFACE --- */
        
        /* Panneau d'instructions (Haut) */
        #top-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #007bff; /* Bleu */
            border-radius: 15px;
            padding: 15px;
            z-index: 2000;
            text-align: center;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
        }

        #direction-icon { font-size: 40px; display: block; margin-bottom: 5px; }
        #direction-text { font-size: 20px; font-weight: bold; color: #007bff; line-height: 1.2; }
        #step-dist { font-size: 16px; color: #666; margin-top: 5px; }

        /* Panneau Global (Bas) */
        #bottom-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 25px;
            z-index: 2000;
            text-align: center;
            color: #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        h1 { margin: 0 0 10px 0; font-size: 16px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Affichage de la distance restante floue */
        #fuzzy-distance {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        /* Bouton Démarrer */
        #start-btn {
            background: linear-gradient(45deg, #007bff, #0056b3); /* Bleu */
            color: white;
            border: none;
            padding: 15px 0;
            font-size: 18px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            margin-top: 10px;
        }
        #start-btn:active { transform: scale(0.96); }

        #status { font-size: 10px; color: #888; margin-top: 15px; font-style: italic; }

    </style>
</head>
<body>

<div id="map"></div>

<div id="top-panel">
    <span id="direction-icon">⬆️</span>
    <div id="direction-text">Prêt au départ</div>
    <div id="step-dist">0 m</div>
</div>

<div id="bottom-panel">
    <h1>Destination Mystère</h1>
    <div id="fuzzy-distance">??? km</div>

    <div id="start-container">
        <p style="font-size:14px; color:#666; margin-bottom:10px;">Activez le GPS pour commencer</p>
        <button id="start-btn" onclick="askForPermission()">Démarrer l'aventure</button>
    </div>
    
    <div id="status">En attente...</div>
</div>
