<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Navigator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuration de la police Inter et personnalisation Tailwind */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { font-family: 'Inter', sans-serif; }
        
        /* Assure que la carte et le brouillard occupent l'espace prévu */
        #map { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; z-index: 10; }
        #fog-of-war {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* Brouillard noir semi-transparent */
            z-index: 20; /* Au-dessus de la carte, sous l'interface */
            transition: opacity 1s ease-in-out;
        }

        /* Style pour l'affichage des instructions et de la distance */
        #ui-overlay { z-index: 30; }
        .instruction-icon { width: 3rem; height: 3rem; }

        /* Animation de pulsation pour la zone de révélation */
        @keyframes pulse-reveal {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
        .pulsing-marker {
            animation: pulse-reveal 1.5s infinite;
        }
    </style>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/S7L54v38+Yf+V3qgqE=" crossorigin=""/>
</head>
<body class="bg-gray-900 text-white overflow-hidden">

    <!-- Carte Leaflet -->
    <div id="map"></div>

    <!-- Brouillard de Guerre (Fog of War) -->
    <div id="fog-of-war" class="opacity-100"></div>

    <!-- Interface Utilisateur (UI Overlay) -->
    <div id="ui-overlay" class="absolute inset-0 flex flex-col justify-between p-4 pointer-events-none">

        <!-- Bannière d'Instructions (F.3) -->
        <div id="instruction-banner" class="w-full pointer-events-auto">
            <div class="bg-gray-800/90 backdrop-blur-sm rounded-xl p-3 flex items-center justify-center space-x-4 shadow-2xl">
                <!-- Icône directionnelle -->
                <svg id="direction-icon" class="instruction-icon text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
                <!-- Texte de l'instruction -->
                <p id="instruction-text" class="text-lg font-bold text-center">Recherche de position GPS...</p>
            </div>
        </div>

        <!-- Compteur de Distance et Bouton d'Action (F.4) -->
        <div class="w-full flex flex-col items-center space-y-4 pointer-events-auto">
            
            <!-- Compteur de Distance Restante -->
            <div class="bg-indigo-600/90 rounded-full py-2 px-6 shadow-2xl">
                <p id="distance-counter" class="text-3xl font-extrabold text-white">
                    0.00 km RESTANTS
                </p>
            </div>

            <!-- Message de Révélation -->
            <div id="revelation-message" class="hidden bg-yellow-400 text-gray-900 rounded-lg p-2 font-semibold text-center shadow-lg transform transition duration-500 scale-100">
                DESTINATION RÉVÉLÉE ! Moins de 2 km.
            </div>

            <!-- Boutons de Contrôle -->
            <div class="flex space-x-4">
                <button id="pause-button" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-150 transform hover:scale-105">
                    <svg class="w-6 h-6 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    Pause
                </button>
                <button id="stop-button" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-150 transform hover:scale-105">
                    <svg class="w-6 h-6 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    Arrêter
                </button>
            </div>
        </div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfR4k6i5Pq6q1AT6N9bA==" crossorigin=""></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- CONFIGURATION ---
            const DESTINATION_COORDS = [46.575945, 5.954497]; // Coordonnées de la destination mystère (F.1)
            const FOG_REVEAL_DISTANCE_KM = 2; // Rayon de révélation pour le brouillard et la destination (F.2 / Condition)
            const OSRM_API_URL = 'https://router.project-osrm.org/route/v1/driving/';
            const UPDATE_INTERVAL_MS = 10000; // Intervalle de mise à jour de l'itinéraire (10 secondes)

            // --- VARIABLES GLOBALES D'ÉTAT ---
            let map;
            let userMarker;
            let destinationMarker;
            let routePolyline;
            let currentLatitude = null;
            let currentLongitude = null;
            let isRevealed = false;
            let isPaused = false;
            let watchId;
            let routingInterval;
            let lastInstruction = "";
            let currentRouteDistance = 0;

            const instructionTextEl = document.getElementById('instruction-text');
            const distanceCounterEl = document.getElementById('distance-counter');
            const directionIconEl = document.getElementById('direction-icon');
            const fogOfWarEl = document.getElementById('fog-of-war');
            const revelationMessageEl = document.getElementById('revelation-message');
            const pauseButton = document.getElementById('pause-button');
            const stopButton = document.getElementById('stop-button');

            // --- INITIALISATION DE LA CARTE ---
            function initMap() {
                // Initialisation de la carte (coordonnées par défaut au centre de la France avant GPS)
                map = L.map('map', {
                    zoomControl: false,
                    attributionControl: false
                }).setView([46.2276, 2.2137], 6); // Vue initiale
                
                // Ajout des tuiles OpenStreetMap
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);

                // Marqueur de l'utilisateur (bleu)
                userMarker = L.circleMarker([0, 0], {
                    radius: 8,
                    color: '#3b82f6',
                    fillColor: '#60a5fa',
                    fillOpacity: 1
                }).addTo(map);
                
                // Marqueur de destination (caché initialement)
                // Le marquer est ajouté mais invisible par défaut
                destinationMarker = L.circleMarker(DESTINATION_COORDS, {
                    radius: 8,
                    color: '#f87171',
                    fillColor: '#ef4444',
                    fillOpacity: 0.7,
                    opacity: 0, // Initiallement invisible
                    pane: 'markerPane' // Assure que le marqueur est au-dessus de la ligne
                }).addTo(map);

                // Configuration du suivi du GPS (Centrage carte)
                map.on('locationfound', onLocationFound);
            }

            // --- LOGIQUE DU BROUILLARD DE GUERRE (F.2) ---
            function updateFogOfWar() {
                if (isRevealed) {
                    fogOfWarEl.style.opacity = '0'; // Disparition du brouillard après révélation
                    return;
                }
                
                if (!currentLatitude) return;

                // 1. Conversion du rayon de 2km en pixels à l'écran
                // Ceci nécessite une conversion complexe LatLng -> Point -> Pixels
                // Nous allons utiliser la fonction de conversion de Leaflet
                
                // 1.1 Obtenir le point de l'utilisateur sur le conteneur de la carte (en pixels)
                const userPoint = map.latLngToContainerPoint([currentLatitude, currentLongitude]);
                
                // 1.2 Obtenir le point situé à 2km à l'est de l'utilisateur (approx.)
                const point2kmEast = L.latLng(currentLatitude, currentLongitude).destinationPoint(90, FOG_REVEAL_DISTANCE_KM * 1000);
                const point2kmEastScreen = map.latLngToContainerPoint(point2kmEast);

                // 1.3 Calculer le rayon en pixels
                const pixelRadius = Math.abs(point2kmEastScreen.x - userPoint.x);

                // 1.4 Centrer le clip-path sur le point utilisateur (relatif au viewport)
                const containerRect = map.getContainer().getBoundingClientRect();
                const mapLeft = containerRect.left;
                const mapTop = containerRect.top;
                
                const userX = userPoint.x - mapLeft;
                const userY = userPoint.y - mapTop;

                // Appliquer le clip-path CSS (masque circulaire)
                fogOfWarEl.style.clipPath = `circle(${pixelRadius}px at ${userX}px ${userY}px)`;
            }

            // --- GESTION DE LA POSITION GPS (F.2, Centrage) ---
            function startGeolocation() {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        currentLatitude = position.coords.latitude;
                        currentLongitude = position.coords.longitude;
                        const latLng = [currentLatitude, currentLongitude];

                        // Mettre à jour la position du marqueur utilisateur
                        userMarker.setLatLng(latLng);

                        // Centrer la carte sur l'utilisateur (F.2/Centrage carte)
                        map.setView(latLng, map.getZoom() < 14 ? 14 : map.getZoom()); // Zoom par défaut à 14

                        // Mettre à jour le brouillard
                        updateFogOfWar();
                        
                        // Si l'itinéraire n'a pas encore été tracé, le faire
                        if (!routePolyline) {
                            startRouting();
                            routingInterval = setInterval(updateRouteAndInstructions, UPDATE_INTERVAL_MS);
                        }
                    },
                    (error) => {
                        console.error("Erreur de géolocalisation:", error);
                        instructionTextEl.textContent = "Erreur GPS. Vérifiez les permissions.";
                        speakInstruction("Erreur de géolocalisation. Veuillez vérifier les permissions de votre navigateur.");
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 5000,
                        timeout: 10000
                    }
                );
            }

            // --- LOGIQUE DE ROUTAGE ET MISE À JOUR (F.3, F.4) ---

            /**
             * Récupère l'itinéraire de OSRM et met à jour l'affichage.
             * @param {boolean} isInitialCall Indique si c'est le premier appel de routage.
             */
            async function updateRouteAndInstructions(isInitialCall = false) {
                if (isPaused || !currentLatitude) return;

                const start = `${currentLongitude},${currentLatitude}`;
                const end = `${DESTINATION_COORDS[1]},${DESTINATION_COORDS[0]}`; // OSRM utilise [Lng, Lat]

                const url = `${OSRM_API_URL}${start};${end}?overview=full&steps=true&geometries=geojson`;

                try {
                    const response = await fetch(url);
                    const data = await response.json();

                    if (data.code !== 'Ok' || data.routes.length === 0) {
                        instructionTextEl.textContent = "Impossible de calculer l'itinéraire.";
                        return;
                    }

                    const route = data.routes[0];
                    const routeCoordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]); // Inverser pour Leaflet [Lat, Lng]
                    currentRouteDistance = route.distance / 1000; // Distance en km

                    // 1. Mise à jour de la polyligne de l'itinéraire
                    if (routePolyline) {
                        map.removeLayer(routePolyline);
                    }
                    routePolyline = L.polyline(routeCoordinates, { color: isRevealed ? '#3b82f6' : '#9ca3af', weight: 6, opacity: 0.7 }).addTo(map);

                    // 2. Mise à jour de la distance restante (F.4)
                    const formattedDistance = currentRouteDistance.toFixed(2);
                    distanceCounterEl.textContent = `${formattedDistance} km RESTANTS`;

                    // 3. Mise à jour des instructions (F.3)
                    const currentStep = data.routes[0].legs[0].steps[0];
                    const currentInstruction = currentStep.maneuver.instruction;
                    
                    if (currentInstruction && currentInstruction !== lastInstruction) {
                        instructionTextEl.textContent = currentInstruction;
                        updateDirectionIcon(currentStep.maneuver.type, currentStep.maneuver.modifier);
                        speakInstruction(currentInstruction);
                        lastInstruction = currentInstruction;
                    } else if (isInitialCall) {
                        // Instruction initiale de départ
                        instructionTextEl.textContent = "Démarrez votre trajet vers la destination mystère !";
                        speakInstruction("Démarrez votre trajet vers la destination mystère !");
                        lastInstruction = "Départ";
                    }

                    // 4. Vérification de la Condition de Révélation
                    if (!isRevealed && currentRouteDistance <= FOG_REVEAL_DISTANCE_KM) {
                        revealDestination();
                    }

                } catch (error) {
                    console.error("Erreur lors de la récupération de l'itinéraire:", error);
                    instructionTextEl.textContent = "Erreur de connexion au service de routage.";
                }
            }

            // --- REVELATION (Action de Révélation) ---
            function revealDestination() {
                isRevealed = true;
                
                // 1. Afficher le marqueur de destination
                destinationMarker.setStyle({ opacity: 1, color: '#10b981', fillColor: '#10b981' });
                destinationMarker.setRadius(12); // Rendre le marqueur plus visible
                destinationMarker.getElement().classList.add('pulsing-marker'); // Ajouter l'effet de pulsation
                destinationMarker.bindPopup("Destination Mystère !").openPopup();

                // 2. Retirer le brouillard de guerre
                fogOfWarEl.style.opacity = '0';

                // 3. Mettre à jour le tracé de la route
                if (routePolyline) {
                    routePolyline.setStyle({ color: '#10b981' });
                }

                // 4. Afficher le message de révélation
                revelationMessageEl.classList.remove('hidden');
                instructionTextEl.textContent = "Vous êtes à proximité ! Destination Révélée !";
                speakInstruction("Destination révélée ! Vous êtes tout proche de votre but.");
            }

            // --- GUIDAGE VOCAL (TTS) ---
            const synth = window.speechSynthesis;
            function speakInstruction(text) {
                if (synth.speaking || isPaused) return;

                const utterance = new SpeechSynthesisUtterance(text);
                // Utiliser une voix française si disponible
                const voices = synth.getVoices();
                const frenchVoice = voices.find(voice => voice.lang.startsWith('fr'));
                if (frenchVoice) {
                    utterance.voice = frenchVoice;
                }
                utterance.lang = 'fr-FR';
                synth.speak(utterance);
            }

            // --- MISE À JOUR DES ICÔNES DIRECTIONNELLES ---
            function updateDirectionIcon(type, modifier) {
                let path = 'M14 5l7 7m0 0l-7 7m7-7H3'; // Flèche droite par défaut

                // Mettre à jour l'icône SVG en fonction du type et du modificateur OSRM
                switch (type) {
                    case 'turn':
                    case 'new name':
                    case 'depart':
                    case 'arrive':
                        if (modifier.includes('left') || modifier.includes('sharp left')) {
                            path = 'M15 19l-7-7 7-7'; // Gauche
                        } else if (modifier.includes('right') || modifier.includes('sharp right')) {
                            path = 'M9 5l7 7-7 7'; // Droite
                        } else if (modifier.includes('straight')) {
                            path = 'M12 5v14'; // Tout droit
                        }
                        break;
                    case 'rotary':
                    case 'roundabout':
                        path = 'M11 15.5H7.5A4.5 4.5 0 013 11V5.5m0 0l-2 2.5m2-2.5l2 2.5m16 0H12m7 0v7.5A4.5 4.5 0 0115.5 19H12m0 0l2 2m-2-2l-2 2'; // Rond-point (simplifié)
                        break;
                    // ... ajouter plus de cas au besoin
                }
                
                directionIconEl.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="${path}" />`;
            }

            // --- GESTION DES BOUTONS D'ACTION ---
            
            // Bouton Pause/Reprendre
            pauseButton.addEventListener('click', () => {
                isPaused = !isPaused;
                if (isPaused) {
                    pauseButton.innerHTML = `<svg class="w-6 h-6 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132c.15-.1.225-.213.225-.333s-.075-.233-.225-.333z" /></svg> Reprendre`;
                    clearInterval(routingInterval);
                    instructionTextEl.textContent = "Navigation en PAUSE.";
                    speakInstruction("Navigation en pause.");
                } else {
                    pauseButton.innerHTML = `<svg class="w-6 h-6 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Pause`;
                    updateRouteAndInstructions(); // Mettre à jour immédiatement
                    routingInterval = setInterval(updateRouteAndInstructions, UPDATE_INTERVAL_MS);
                    instructionTextEl.textContent = "Navigation reprise.";
                    speakInstruction("Navigation reprise.");
                }
            });

            // Bouton Arrêter
            stopButton.addEventListener('click', () => {
                if (watchId) {
                    navigator.geolocation.clearWatch(watchId);
                }
                if (routingInterval) {
                    clearInterval(routingInterval);
                }
                if (routePolyline) {
                    map.removeLayer(routePolyline);
                }
                fogOfWarEl.style.clipPath = 'none';
                fogOfWarEl.style.opacity = '0';
                instructionTextEl.textContent = "Navigation ARRÊTÉE.";
                distanceCounterEl.textContent = "0.00 km";
                revelationMessageEl.classList.add('hidden');
                speakInstruction("Navigation arrêtée.");
                // Réinitialiser les marqueurs si nécessaire, ou laisser l'utilisateur explorer
            });


            // --- DÉMARRAGE DE L'APPLICATION ---
            initMap();
            startGeolocation();
        });
    </script>
    
</body>
</html>
